org.gradle.jvmargs=-Xmx1280m -XX:ActiveProcessorCount=2 -Djava.util.concurrent.ForkJoinPool.common.parallelism=1 -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Build sequentially on 8GB developer machines; daemons do not stay resident.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
