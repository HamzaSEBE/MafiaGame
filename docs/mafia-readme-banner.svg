  <!-- QR-inspired mark -->
  <g transform="translate(431 301)" opacity="0.72" fill="none" stroke="#F6C96B" stroke-width="2">
    <rect x="0" y="0" width="39" height="39" rx="5" stroke-opacity="0.48" />
    <rect x="6" y="6" width="10" height="10" rx="1" />
    <rect x="23" y="6" width="10" height="10" rx="1" />
