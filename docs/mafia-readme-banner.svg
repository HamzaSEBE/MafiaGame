    <path d="M289 192c8-8 16-8 24 0m10 0c8-8 16-8 24 0" fill="none" stroke="#FB7185" stroke-width="3" stroke-linecap="round" />
    <path d="M298 253h40m-34 10h28" stroke="#FB7185" stroke-opacity="0.56" stroke-linecap="round" />
    <path d="M261 285h114" stroke="#FB7185" stroke-opacity="0.42" />
