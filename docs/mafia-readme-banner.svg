<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">مافيا عالشوارب</title>
  <desc id="desc">ليلة غامضة، بطاقات أدوار، ولمحة عن اللعب عبر QR.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070B" />
      <stop offset="0.56" stop-color="#100B14" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="bloodGlow" cx="0.17" cy="0.48" r="0.72">
      <stop offset="0" stop-color="#8B1534" stop-opacity="0.56" />
      <stop offset="1" stop-color="#8B1534" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.88" cy="0.05" r="0.72">
      <stop offset="0" stop-color="#6D3CC8" stop-opacity="0.25" />
      <stop offset="1" stop-color="#6D3CC8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31131E" />
      <stop offset="1" stop-color="#160E16" />
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10283B" />
      <stop offset="1" stop-color="#101722" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6C96B" stop-opacity="0" />
      <stop offset="0.45" stop-color="#F6C96B" stop-opacity="0.9" />
      <stop offset="1" stop-color="#E11D48" stop-opacity="0" />
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#FFFFFF" opacity="0.09" />
      <circle cx="22" cy="19" r="0.8" fill="#FFFFFF" opacity="0.06" />
      <path d="M0 33.5H34" stroke="#FFFFFF" stroke-opacity="0.025" />
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#night)" />
  <rect width="1200" height="430" rx="28" fill="url(#bloodGlow)" />
  <rect width="1200" height="430" rx="28" fill="url(#violetGlow)" />
  <rect width="1200" height="430" rx="28" fill="url(#grain)" />

