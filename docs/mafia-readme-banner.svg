  <text x="817" y="329" text-anchor="middle" fill="#94A3B8" font-family="Cairo, 'Noto Sans Arabic', Arial, sans-serif" font-size="16" direction="rtl">إدارة وجهًا لوجه · أدوار سرّية · لعب تفاعلي عبر QR</text>
  <circle cx="1061" cy="115" r="3" fill="#E11D48" />
  <circle cx="1074" cy="115" r="3" fill="#8B5CF6" />
  <circle cx="1087" cy="115" r="3" fill="#0EA5E9" />
  <path d="M70 390h1060" stroke="url(#goldLine)" stroke-width="1" opacity="0.8" />
