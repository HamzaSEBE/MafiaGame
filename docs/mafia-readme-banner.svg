  <!-- brand lockup -->
  <g text-anchor="middle" direction="rtl" font-family="Cairo, 'Noto Sans Arabic', Arial, sans-serif">
    <text x="817" y="116" fill="#F6C96B" font-size="15" font-weight="700" letter-spacing="4">MAFIA  ·  GAME MASTER</text>
    <text x="817" y="205" fill="#F8FAFC" font-size="69" font-weight="900">مافيا عالشوارب</text>
    <text x="817" y="257" fill="#CBD5E1" font-size="25" font-weight="500">المدينة نائمة… والحقيقة بين أيديكم</text>
