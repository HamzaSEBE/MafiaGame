name: mafia_nightfall
description: "Moderator / Game Master Assistant for Mafia Nightfall"
publish_to: 'none'
version: 1.2.8+15

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  game_core:
    path: packages/game_core
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.10

  # Utils
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  uuid: ^4.3.3
  equatable: ^2.1.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  google_sign_in: 6.2.1
  flutter_animate: ^4.5.2
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  firebase_app_check: ^0.3.2+10
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  licenses:
    - assets/fonts/OFL.txt
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
