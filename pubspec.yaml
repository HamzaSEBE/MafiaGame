name: mafia_nightfall
description: "Moderator / Game Master Assistant for Mafia Nightfall"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Utils
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  equatable: ^2.1.0
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  screenshot: ^3.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
