<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="مافيا عالشوارب — بطاقتك السرية، تصويتك، وحركاتك في جلسة الحكم عبر QR.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مافيا عالشوارب">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>مافيا عالشوارب · المدينة تنتظرك</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0f172a;color:#f8f6f2}
    #launch{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#0f172a,#020617);font-family:system-ui,sans-serif;padding:28px;text-align:center}
    .seal{width:64px;height:64px;display:grid;place-items:center;margin:auto;border:1px solid #ff5252;border-radius:20px;background:linear-gradient(135deg,#8b0000,#4a0000);font-size:30px}
    h1{font-size:28px;margin:24px 0 10px}p{color:#b8c4d6;line-height:1.8;max-width:340px}
    #retry{display:none;margin:24px auto 0;padding:12px 24px;border:1px solid #ff5252;border-radius:12px;background:#8b0000;color:white;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <div id="launch" role="status" aria-live="polite"><main>
    <div class="seal" aria-hidden="true">م</div>
    <h1>مافيا عالشوارب</h1><p id="launch-message">المدينة تستعد لليلة أخرى…<br>جارٍ فتح طاولتك السرية.</p>
    <button id="retry" onclick="location.reload()">إعادة المحاولة</button>
    <noscript><p>فعّل JavaScript للانضمام إلى اللعبة.</p></noscript>
  </main></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
